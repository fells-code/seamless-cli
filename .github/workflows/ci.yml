name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    strategy:
      fail-fast: false
      matrix:
        # The supported range is engines >=22: the oldest supported LTS, the
        # development default from .nvmrc, and the newest release.
        node-version: [22, 24, latest]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check @seamless-auth/types is current
        run: npm run check:types-current

      - name: Check the templates commit matches its tag
        run: npm run check:templates-pin

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
