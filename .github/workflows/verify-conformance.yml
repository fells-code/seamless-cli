# Reusable cross-repo conformance run. Checks out the whole ecosystem as siblings,
# then runs `seamless verify` (the api/adapter/react matrix) against it. Callers in
# each repo pass their own PR ref so a change in one repo is tested against the
# others at their default branch.
name: verify-conformance

on:
  workflow_call:
    inputs:
      local:
        description: Build the SDKs from source (true) or use published packages (false).
        type: boolean
        default: true
      dev:
        description: >-
          Also run each browser template on its development server (React Strict Mode).
          On by default: the bugs it catches are introduced in SDK and template pull
          requests, so it has to see those pull requests, not a nightly build.
        type: boolean
        default: true
      cli-ref:
        type: string
        default: ''
      api-ref:
        type: string
        default: ''
      server-ref:
        type: string
        default: ''
      react-ref:
        type: string
        default: ''
      templates-ref:
        type: string
        default: ''

jobs:
  verify:
    runs-on: ubuntu-latest
    # 30 left no headroom: a degraded npm registry once took this to 30m00s exactly, which
    # GitHub reports as `cancelled` with every step green. The build cache is what makes a
    # normal run fast (about 4 minutes warm); this is so the next bad network day is a slow
    # check rather than a red one.
    timeout-minutes: 45
    env:
      HUSKY: '0'
      # The images built here are thrown away when the job ends, so the provenance
      # attestation buildx adds by default buys nothing. A tidy-up rather than a
      # speed-up: it looked like it cost 301s once, but that was a network stall landing
      # on whichever step happened to be doing I/O, and it resolves in under a second on a
      # healthy run.
      BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
      # compose only honours build cache_from / cache_to when it delegates to bake.
      COMPOSE_BAKE: 'true'
      # Layers the CI-only build cache over the base compose file. Read by
      # `seamless verify`; unset locally, where `type=gha` would be an error.
      SEAMLESS_VERIFY_COMPOSE_OVERRIDE: ${{ github.workspace }}/seamless-cli/verify/docker-compose.cache.yml
    steps:
      - name: Checkout seamless-cli
        uses: actions/checkout@v4
        with:
          repository: fells-code/seamless-cli
          ref: ${{ inputs.cli-ref }}
          path: seamless-cli

      - name: Checkout seamless-auth-api
        uses: actions/checkout@v4
        with:
          repository: fells-code/seamless-auth-api
          ref: ${{ inputs.api-ref }}
          path: seamless-auth-api

      - name: Checkout seamless-auth-server
        uses: actions/checkout@v4
        with:
          repository: fells-code/seamless-auth-server
          ref: ${{ inputs.server-ref }}
          path: seamless-auth-server

      - name: Checkout seamless-auth-react
        uses: actions/checkout@v4
        with:
          repository: fells-code/seamless-auth-react
          ref: ${{ inputs.react-ref }}
          path: seamless-auth-react

      - name: Checkout seamless-templates
        uses: actions/checkout@v4
        with:
          repository: fells-code/seamless-templates
          ref: ${{ inputs.templates-ref }}
          path: seamless-templates

      - uses: actions/setup-node@v4
        with:
          # Reusable workflow: it checks out sibling repos into subpaths, so there
          # is no single repo .nvmrc to read here. Pin the Node major directly.
          node-version: 24
          # Warms ~/.npm for all three npm installs below. This job is install-bound
          # rather than compute-bound, and an uncached registry is what pushes it past
          # its own timeout: when npm was degraded, `npm ci && npm run build` for the CLI
          # went from 6s to 214s on its own.
          cache: npm
          cache-dependency-path: |
            seamless-cli/package-lock.json
            seamless-cli/verify/harness/package-lock.json
            seamless-auth-react/package-lock.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # The default docker driver cannot export a build cache. The container driver can,
      # and `docker-container` still loads the built images into the daemon for compose to
      # run, which is what the rest of the job needs.
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      # Exposes ACTIONS_CACHE_URL and ACTIONS_RUNTIME_TOKEN to the build, which the
      # `type=gha` cache backend needs and which are otherwise only visible to actions.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v3

      # pnpm keeps its own store rather than using ~/.npm, so the setup-node cache above
      # does nothing for the server install. Skipped with the install it serves.
      - name: Locate the pnpm store
        if: ${{ inputs.local }}
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        if: ${{ inputs.local }}
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('seamless-auth-server/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # Chromium is ~150MB and is re-downloaded on every run otherwise. A restore-keys hit
      # on a stale key is still useful: `playwright install` then fetches only what the
      # pinned version actually needs.
      - name: Cache the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('seamless-cli/verify/harness/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Build the CLI
        working-directory: seamless-cli
        run: npm ci && npm run build

      # --local builds the SDKs from source on the host (server via pnpm, the React
      # SDK via npm), so those repos need their dependencies installed first. The
      # api / adapter / starter are built inside Docker and don't need host installs.
      - name: Install SDK dependencies
        if: ${{ inputs.local }}
        run: |
          (cd seamless-auth-server && pnpm install --frozen-lockfile)
          (cd seamless-auth-react && npm ci)

      # Pre-install the harness deps + chromium (with system libs) so the run uses
      # them; `seamless verify` would otherwise install the browser without OS deps.
      - name: Install harness + browser
        working-directory: seamless-cli/verify/harness
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run seamless verify
        working-directory: seamless-cli
        env:
          SEAMLESS_API_DIR: ${{ github.workspace }}/seamless-auth-api
          SEAMLESS_SERVER_DIR: ${{ github.workspace }}/seamless-auth-server
          SEAMLESS_REACT_SDK_DIR: ${{ github.workspace }}/seamless-auth-react
          # Point at the whole templates checkout so verify enumerates the registry
          # and conformance-tests every web template, each scoped to its own flows.
          SEAMLESS_TEMPLATES_DIR: ${{ github.workspace }}/seamless-templates
        run: node dist/index.js verify ${{ inputs.local && '--local' || '' }} ${{ inputs.dev && '--dev' || '' }}

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: seamless-cli/verify/harness/results/
          if-no-files-found: ignore
