# Conformance stack for `seamless verify`.
#
# Postgres, the auth API built from local source, and two adopter backends that are
# deliberate twins (Express on 3000, Fastify on 3001) so a failure is attributable to
# one framework. The web starter is behind the `react` profile, since the api and
# adapter layers need no browser.
#
# Env comes from the `seamless verify` process, not a file:
#   SEAMLESS_API_DIR    absolute path to the seamless-auth-api source (build context)
#   SEAMLESS_REACT_DIR  absolute path to the web template to serve (react and
#                       react-dev profiles)
#   SEAMLESS_FULLSTACK_DIR  absolute path to the full-stack template to serve
#                       (nextjs and nextjs-dev profiles)
#   API_SERVICE_TOKEN   shared secret between the API and both adapters
#   JWKS_KID            key id the adapters expect (must match the API's active kid)
#   OWNER_EMAIL         tenant owner; this email gets the admin role at signup
#
# The adapters are built from ./adapter-app and ./adapter-fastify-app in this repo,
# so they take no path from the environment.

name: seamless-verify

services:
  postgres:
    # Matches POSTGRES_IMAGE in src/core/images.ts, so the harness runs the same
    # major a fresh scaffold gets. Every run starts with `down -v`, so the volume
    # is always new and a major bump needs no migration here.
    image: postgres:18
    environment:
      POSTGRES_USER: seamless
      POSTGRES_PASSWORD: seamless
      POSTGRES_DB: seamless_auth
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seamless -d seamless_auth']
      interval: 3s
      timeout: 3s
      retries: 20

  auth-api:
    # Built with the production Dockerfile (compiles dist/). Its validateEnvs.sh
    # entrypoint runs the migrations and gates startup on the env below.
    build:
      context: ${SEAMLESS_API_DIR}
      dockerfile: Dockerfile
    ports:
      - '5312:5312'
    environment:
      # `development`, not `test`: signing treats any non-production env as dev, but
      # the JWKS endpoint only serves the auto-generated dev public key under
      # `development`. The adapters and SDKs need that key to verify tokens.
      NODE_ENV: development
      PORT: '5312'
      APP_NAME: Seamless Verify
      APP_ID: seamless-verify
      APP_ORIGINS: http://localhost:3000,http://localhost:5173
      # Must equal the adapter's AUTH_SERVER_URL: the adapter validates the `iss`
      # claim on API-signed tokens against the URL it reaches the API on.
      ISSUER: http://auth-api:5312
      DEFAULT_ROLES: user
      # betaUser is the role the Next.js starter's /beta route requires.
      AVAILABLE_ROLES: user,admin,betaUser
      LOGIN_METHODS: passkey,magic_link,email_otp,phone_otp,oauth
      # The base URL for emailed magic links, required at boot: with a fresh DB
      # there is no seeded system_config row to fall back on, so the server exits
      # without it. The browser-visible web app runs on 5173.
      FRONTEND_URL: http://localhost:5173
      DB_LOGGING: 'false'
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 1h
      RATE_LIMIT: '100000'
      DELAY_AFTER: '100000'
      # The dedicated per-IP OTP/magic-link/registration/OAuth limiters are not
      # tuned by RATE_LIMIT; the suite drives many flows from one IP and would trip
      # them. This dev-only flag skips them (ignored under NODE_ENV=production).
      DISABLE_AUTH_RATE_LIMITS: 'true'
      RPID: localhost
      ORIGINS: http://localhost:5173,http://localhost:3000
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: seamless
      DB_PASSWORD: seamless
      DB_NAME: seamless_auth
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
      # The first admin comes from the OWNER_EMAIL grant at signup, so the
      # harness can assert admin promotion without a separate invite flow.
      OWNER_EMAIL: ${OWNER_EMAIL}
      # OAuth: a single "mock" provider backed by the harness's in-process OIDC.
      # authorizationUrl is browser/harness-visible (localhost); token/userInfo are
      # called server-side from the container, so they go via host.docker.internal.
      MOCK_CLIENT_SECRET: mock-secret
      OAUTH_PROVIDERS: '[{"id":"mock","name":"Mock OIDC","enabled":true,"clientId":"mock-client","clientSecretEnv":"MOCK_CLIENT_SECRET","authorizationUrl":"http://localhost:9000/authorize","tokenUrl":"http://host.docker.internal:9000/token","userInfoUrl":"http://host.docker.internal:9000/userinfo","scopes":["openid","email"],"redirectUri":"http://localhost:5173/oauth/callback","redirectUris":["http://localhost:5173/oauth/callback"],"allowSignup":true,"accountLinking":"email"}]'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'dist/healthCheck.js']
      interval: 3s
      timeout: 5s
      retries: 40

  # Harness-owned adopter backend: real @seamless-auth/express with a capture
  # transport so the harness can read OTP/magic-link codes the adapter would
  # otherwise strip. ISSUER on auth-api is set to this AUTH_SERVER_URL host.
  adapter:
    build:
      context: ./adapter-app
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      AUTH_SERVER_URL: http://auth-api:5312
      APP_ORIGIN: http://localhost:3000
      # Browser origin allowed by CORS (the React app, served below).
      WEB_ORIGIN: http://localhost:5173
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
      COOKIE_SIGNING_KEY: ${API_SERVICE_TOKEN}
      JWKS_KID: ${JWKS_KID}
    depends_on:
      auth-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/']
      interval: 3s
      timeout: 3s
      retries: 20

  # The same adopter backend on Fastify, so the cookie path is conformance-tested
  # for both adapters rather than only the one the harness happens to be written
  # against. Identical env contract and capture transport; only the framework and
  # the published port differ, which is what makes a failure here attributable.
  adapter-fastify:
    build:
      context: ./adapter-fastify-app
    ports:
      - '3001:3001'
    environment:
      PORT: '3001'
      AUTH_SERVER_URL: http://auth-api:5312
      APP_ORIGIN: http://localhost:3001
      WEB_ORIGIN: http://localhost:5173
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
      COOKIE_SIGNING_KEY: ${API_SERVICE_TOKEN}
      JWKS_KID: ${JWKS_KID}
    depends_on:
      auth-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/']
      interval: 3s
      timeout: 3s
      retries: 20

  # React starter app (built SPA on nginx), pointed at the adapter so the React
  # SDK's `${apiHost}/auth/*` calls hit the adapter's mount. Browser-visible URL,
  # so API_URL is the host-mapped adapter (localhost:3000), not the compose host.
  # Gated behind the `react` profile so the api/adapter-only runs skip the build.
  #
  # The inline Dockerfile mirrors the starter's own Dockerfile, but additionally
  # installs locally-built @seamless-auth/react (and @seamless-auth/client)
  # tarballs when present (--local mode packs them into ./react-vendor; that dir
  # is empty otherwise → published SDK). Installed in one command so npm resolves
  # react's client dependency from the sibling tarball rather than the registry.
  react:
    profiles: ['react']
    build:
      context: ${SEAMLESS_REACT_DIR}
      additional_contexts:
        sdk: ./react-vendor
      dockerfile_inline: |
        FROM node:24-slim AS builder
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY . .
        COPY --from=sdk . /tmp/sdk/
        RUN if ls /tmp/sdk/*.tgz >/dev/null 2>&1; then \
              npm install /tmp/sdk/*.tgz; \
            fi
        RUN npm run build
        FROM nginx:alpine
        COPY ./nginx.conf /etc/nginx/conf.d/default.conf
        COPY --from=builder /app/dist /usr/share/nginx/html
        COPY entrypoint.sh /entrypoint.sh
        RUN chmod +x /entrypoint.sh
        EXPOSE 80
        CMD ["/entrypoint.sh"]
    ports:
      - '5173:80'
    environment:
      API_URL: http://localhost:3000
    depends_on:
      adapter:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/health']
      interval: 3s
      timeout: 3s
      retries: 20

  # The same web template on its development server (`npm run dev`), so the
  # browser specs also run under React Strict Mode, which mounts every component
  # twice and runs every effect twice. Production builds run effects once, so an
  # effect that is not idempotent (a single-use link spent twice, say) passes the
  # `react` service and fails here, exactly as it fails on a developer's first
  # `npm run dev`. Same host port as `react`; the two are never up together.
  #
  # Vite listens on 5173 inside the container as well, so the HMR client's
  # websocket goes to the port the page was served from.
  react-dev:
    profiles: ['react-dev']
    build:
      context: ${SEAMLESS_REACT_DIR}
      additional_contexts:
        sdk: ./react-vendor
      dockerfile_inline: |
        FROM node:24-slim
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY . .
        COPY --from=sdk . /tmp/sdk/
        RUN if ls /tmp/sdk/*.tgz >/dev/null 2>&1; then \
              npm install /tmp/sdk/*.tgz; \
            fi
        EXPOSE 5173
        CMD ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    ports:
      - '5173:5173'
    environment:
      # The dev server reads the API origin from the environment, not from the
      # config.js the nginx entrypoint writes.
      VITE_API_URL: http://localhost:3000
    depends_on:
      adapter:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  # A full-stack template (the Next.js starter) built with its own Dockerfile's
  # `runtime` target: the standalone production server, on port 80 with /health.
  # It serves /auth itself, so it talks to the auth API directly and needs no
  # adapter. SEAMLESS_VERIFY_CAPTURE turns on the starter's capture transport,
  # which holds OTP and magic-link codes for the harness to read; it is off in
  # every other environment.
  #
  # Built from the template's own lockfile, so it runs the SDK versions the
  # starter pins, with or without --local.
  nextjs:
    profiles: ['nextjs']
    build:
      context: ${SEAMLESS_FULLSTACK_DIR:-.}
      target: runtime
    ports:
      - '5173:80'
    environment: &nextjs-env
      AUTH_SERVER_URL: http://auth-api:5312
      # Equal to AUTH_SERVER_URL here (the API's ISSUER above), so a starter that
      # reads a separate issuer and one that does not both verify the same way.
      AUTH_SERVER_ISSUER: http://auth-api:5312
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
      COOKIE_SIGNING_KEY: ${API_SERVICE_TOKEN}
      JWKS_KID: ${JWKS_KID}
      SEAMLESS_VERIFY_CAPTURE: 'true'
      # The admin dashboard at /console, proxied from auth-api (which serves its
      # bundled build by default). ORIGINS above already allows this origin.
      SERVE_ADMIN_CONSOLE: 'true'
    depends_on:
      auth-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  # The same starter on `next dev` (the Dockerfile's `dev` target), for the
  # Strict Mode pass. See react-dev above.
  nextjs-dev:
    profiles: ['nextjs-dev']
    build:
      context: ${SEAMLESS_FULLSTACK_DIR:-.}
      target: dev
    ports:
      - '5173:80'
    environment: *nextjs-env
    depends_on:
      auth-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60
